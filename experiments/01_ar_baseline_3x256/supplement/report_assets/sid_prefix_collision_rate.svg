<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Item collision rate of the first three SID positions</title>
  <desc id="desc">Seed-level collision rates and mean plus or minus standard deviation for RQ-KMeans and RQ-VAE.</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111827">
    <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="600">Item collision rate of the first three SID positions</text>

    <g stroke="#d1d5db" stroke-width="1">
      <line x1="150" y1="560" x2="1080" y2="560"/>
      <line x1="150" y1="500" x2="1080" y2="500"/>
      <line x1="150" y1="440" x2="1080" y2="440"/>
      <line x1="150" y1="380" x2="1080" y2="380"/>
      <line x1="150" y1="320" x2="1080" y2="320"/>
      <line x1="150" y1="260" x2="1080" y2="260"/>
      <line x1="150" y1="200" x2="1080" y2="200"/>
      <line x1="150" y1="140" x2="1080" y2="140"/>
    </g>

    <g stroke="#111827" stroke-width="1.5">
      <line x1="150" y1="140" x2="150" y2="560"/>
      <line x1="150" y1="560" x2="1080" y2="560"/>
    </g>

    <g font-size="18" text-anchor="end">
      <text x="135" y="566">0%</text>
      <text x="135" y="506">1%</text>
      <text x="135" y="446">2%</text>
      <text x="135" y="386">3%</text>
      <text x="135" y="326">4%</text>
      <text x="135" y="266">5%</text>
      <text x="135" y="206">6%</text>
      <text x="135" y="146">7%</text>
    </g>

    <text x="42" y="350" text-anchor="middle" font-size="20" transform="rotate(-90 42 350)">Items in collided SID groups (%)</text>
    <g font-size="21" text-anchor="middle">
      <text x="390" y="604">RQ-KMeans</text>
      <text x="820" y="604">RQ-VAE</text>
    </g>

    <!-- RQ-KMeans: three seeds -->
    <circle cx="340" cy="340.4" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    <circle cx="390" cy="338.6" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    <circle cx="440" cy="325.4" r="9" fill="#059669" stroke="#ffffff" stroke-width="2"/>
    <g font-size="16" text-anchor="middle">
      <text x="340" y="320">3.66%</text>
      <text x="390" y="318">3.69%</text>
      <text x="440" y="305">3.91%</text>
    </g>

    <!-- RQ-KMeans mean and sample standard deviation -->
    <line x1="390" y1="326.9" x2="390" y2="343.3" stroke="#111827" stroke-width="2"/>
    <line x1="379" y1="326.9" x2="401" y2="326.9" stroke="#111827" stroke-width="2"/>
    <line x1="379" y1="343.3" x2="401" y2="343.3" stroke="#111827" stroke-width="2"/>
    <polygon points="390,326 399,335.1 390,344.2 381,335.1" fill="#111827"/>
    <text x="390" y="382" text-anchor="middle" font-size="17" font-weight="600">mean 3.75% ± 0.14%</text>

    <!-- RQ-VAE: three seeds -->
    <circle cx="770" cy="389.0" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    <circle cx="820" cy="348.2" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    <circle cx="870" cy="218.6" r="9" fill="#059669" stroke="#ffffff" stroke-width="2"/>
    <g font-size="16" text-anchor="middle">
      <text x="770" y="369">2.85%</text>
      <text x="820" y="328">3.53%</text>
      <text x="870" y="198">5.69%</text>
    </g>

    <!-- RQ-VAE mean and sample standard deviation -->
    <line x1="820" y1="229.4" x2="820" y2="407.6" stroke="#111827" stroke-width="2"/>
    <line x1="809" y1="229.4" x2="831" y2="229.4" stroke="#111827" stroke-width="2"/>
    <line x1="809" y1="407.6" x2="831" y2="407.6" stroke="#111827" stroke-width="2"/>
    <polygon points="820,309.4 829,318.5 820,327.6 811,318.5" fill="#111827"/>
    <text x="820" y="444" text-anchor="middle" font-size="17" font-weight="600">mean 4.02% ± 1.48%</text>

    <g font-size="16">
      <circle cx="772" cy="92" r="7" fill="#2563eb"/><text x="787" y="98">2024</text>
      <circle cx="862" cy="92" r="7" fill="#f59e0b"/><text x="877" y="98">2025</text>
      <circle cx="952" cy="92" r="7" fill="#059669"/><text x="967" y="98">2026</text>
      <polygon points="1050,84 1058,92 1050,100 1042,92" fill="#111827"/><text x="1065" y="98">Mean</text>
    </g>

    <text x="615" y="654" text-anchor="middle" font-size="15" fill="#4b5563">Dots: individual seeds; diamond and error bar: mean ± sample standard deviation</text>
  </g>
</svg>
