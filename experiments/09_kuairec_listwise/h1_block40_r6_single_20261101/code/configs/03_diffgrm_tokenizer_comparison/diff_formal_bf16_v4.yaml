# Formal v4 overlay: reproduce the official Beauty base-batch/LR pairing on a
# 10 GB GPU.  The official command uses base batch 1024 with lr=0.01.  A
# physical batch of 64 and 16-way accumulation gives the same base batch while
# leaving the model, data, OCN loss, and evaluation protocol unchanged.
run_id: diff_formal_pse_4x256_officialbatch_v4_bf16
mixed_precision: bf16
gradient_accumulation_steps: 16

# Keep the v3 fail-fast numerical diagnostics.
numerical_guard: true
numerical_guard_parameter_interval: 100
