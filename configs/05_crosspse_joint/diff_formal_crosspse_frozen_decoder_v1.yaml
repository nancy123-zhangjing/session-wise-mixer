# Matched control for the completed DIGER-ST V2 run.
#
# This overlay is loaded after diff_formal_crosspse_joint_diger_v2.yaml. It
# keeps the same pretrained Cross-PSE artifact, pretrained DiffGRM checkpoint,
# model, optimizer schedule, batch setup and evaluation protocol. The only
# experimental change is that Cross-PSE is excluded from the optimizer and its
# hard SIDs are never refreshed.
run_id: diff_formal_crosspse_frozen_decoder_continuation_4x256_seed2024
epochs: 35
reproduction_protocol: frozen_crosspse_decoder_continuation_v1
protocol_note: matched decoder-only continuation control for DIGER-ST V2; initialize the same Cross-PSE v3 and DiffGRM checkpoints, freeze all Cross-PSE parameters and hard SIDs, and spend exactly 35 epochs on Decoder updates

joint_frozen_tokenizer_control: true

# All 35 wall-clock epochs are explicitly inside the recommender-only region.
# max_tokenizer_phases=0 is a second guard in addition to the trainer flag.
joint_recommender_warmup_epochs: 35
joint_max_tokenizer_phases: 0
