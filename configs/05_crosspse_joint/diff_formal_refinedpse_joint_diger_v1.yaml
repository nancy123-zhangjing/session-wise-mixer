# Joint Refined-PSE control for the completed Joint Cross-PSE DIGER-ST V2 run.
#
# Keep the differentiable bridge, alternating schedule, optimization budget and
# evaluation protocol unchanged. The controlled method change is that the
# cross-codebook attention mixer is disabled; only the four base PSE codebooks
# can be updated in tokenizer phases.
run_id: diff_formal_refinedpse_joint_diger_st_v1_slowanneal_4x256_seed2024
epochs: 45
reproduction_protocol: alternating_refinedpse_diffgrm_diger_st_v1_slowanneal
protocol_note: pretrained Refined-PSE v2 catalog tokenizer and matching DiffGRM; DIGER hard-forward soft-backward bridge; alternate one codebook phase and three recommender phases; cross-codebook mixer disabled

sid_quantizer: cross_pse
semantic_n_digit: 4
crosspse_seed: 2024
precomputed_semantic_ids_path: ../../outputs/tokenizers/diff_refinedpse/Beauty/v2_catalog_seed2024/semantic_ids.json
crosspse_summary_path: ../../outputs/tokenizers/diff_refinedpse/Beauty/v2_catalog_seed2024/summary.json

# The key controlled difference from Joint Cross-PSE V2.
crosspse_mixer_enabled: false
crosspse_train_base_codebooks: true
crosspse_heads: 4
crosspse_dropout: 0.0
crosspse_attention_scope: full
crosspse_residual_scale_init: 1.0
crosspse_learn_residual_scale: false
crosspse_zero_init_attention_output: true

joint_crosspse_enabled: true
joint_gradient_mode: diger_st
joint_recommender_source_run_id: diff_formal_refinedpse_4x256_v2_catalog_bf16
joint_crosspse_artifact_dir: ../../outputs/tokenizers/diff_refinedpse/Beauty/v2_catalog_seed2024
joint_crosspse_items_path: ../../data/diff_formal_embeddings/beauty_item_keys.json

# Exactly the same alternation as Joint Cross-PSE DIGER-ST V2.
joint_recommender_warmup_epochs: 5
joint_cycle_epochs: 4
joint_tokenizer_epochs_per_cycle: 1
joint_max_tokenizer_phases: 10
joint_tokenizer_batches_per_phase: 96
joint_sid_refresh_batch_size: 2048
joint_evaluate_initial_state: true

joint_diger_recommendation_weight: 1.0
joint_diger_assignment_temperature: 0.1
joint_diger_softmax_temperature_start: 1.0
joint_diger_softmax_temperature_end: 1.0
joint_diger_gumbel_noise_start: 1.0
joint_diger_gumbel_noise_end: 0.2
joint_diger_uncertainty_decay: cosine

# The recommendation gradient is the only bridge being tested.
joint_recommender_sia_weight: 0.0
joint_tokenizer_sia_weight: 0.0
joint_sia_temperature: 0.1

# There is deliberately no mixer optimizer group in this experiment.
joint_codebook_lr: 0.00001
joint_mixer_lr: 0.0001
joint_weight_decay: 0.0001
joint_balance_weight: 0.01
joint_balance_temperature: 0.1
joint_anchor_weight: 0.01

mixed_precision: bf16
lr: 0.001
warmup_steps: 500
warmup_ratio: 0.0
eval_start_epoch: 5
eval_interval: 5
patience: 5
early_stop_after_warmup: true
evaluation_level: sid
eval_expand_sid_to_items: false
